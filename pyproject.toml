[project]
name = "interface-ai-computer-use"
version = "0.1.0"
description = "Take-home computer-use automation system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "playwright>=1.52,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
  "openai>=1.100,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
replay = "app.replay.cli:main"
generate = "app.generator.cli:main"
serve = "app.main:run"
agent = "app.agent.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
